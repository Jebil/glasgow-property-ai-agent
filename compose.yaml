services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: glasgow-property-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glasgow_property_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glasgow_property_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_pg17_data:
